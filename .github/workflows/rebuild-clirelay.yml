name: Rebuild aigw Image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger aigw docker publish workflow
        env:
          GH_TOKEN: ${{ secrets.aigw_WORKFLOW_TOKEN }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "aigw_WORKFLOW_TOKEN secret is required to trigger aigw docker builds." >&2
            exit 1
          fi

          gh workflow run docker-publish.yml \
            --repo bjxg/aigw \
            --ref "${TARGET_REF}"

          echo "Triggered aigw docker-publish.yml for ${TARGET_REF}"
